name: Bug report
description: Something in Tactile does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in every field - the diagnostics export
        (Settings -> Diagnostics -> Copy) answers most of the questions below.
  - type: input
    id: version
    attributes:
      label: Tactile version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 23H2 x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Sound library / profiles
        - Import
        - Settings
        - Theme or icon
        - Language
        - Cloud backup
        - Tray, hotkeys or startup
        - Updates
        - Onboarding
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings -> Data
        2. Press Connect
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the output of Settings -> Diagnostics -> Copy.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am on the latest release
          required: true
