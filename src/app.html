<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <!--
        Locks the renderer down to bundled resources only. `file:` is listed
        next to 'self' because the window is loaded from disk via loadFile();
        `data:` is required for the sound packs (Howler decodes the base64
        data URIs with atob) and for the rasterized app icon; `'unsafe-inline'`
        for styles is required by the inline `style=` attributes used
        throughout the markup and by the JS-generated cards.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:; media-src 'self' data: file:; font-src 'self' data: file:; connect-src 'self' file:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <title>Tactile</title>
    <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
    <div class="window-container">
        <header class="titlebar">
            <div class="drag-region">
                <div class="brand">
                    <img src="../public/Tactile.svg" alt="Tactile" class="titlebar-mark" title="" data-i18n-title="app.subtitle">
                    <span>Tactile</span>
                    <span class="titlebar-divider" aria-hidden="true"></span>
                    <span class="titlebar-context" id="titlebar-context" data-i18n="nav.sounds"></span>
                </div>
            </div>
            <div class="window-controls">
                <button id="btn-gh-repo" class="win-btn win-btn-link" data-i18n-title="about.github" title="" data-i18n-aria-label="about.github" aria-label="">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.55v-2.1c-3.2.7-3.88-1.36-3.88-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.26 5.69.41.36.78 1.06.78 2.14v3.17c0 .3.21.66.8.55A11.5 11.5 0 0 0 23.5 12A11.5 11.5 0 0 0 12 .5Z"/></svg>
                </button>
                <button id="btn-min" class="win-btn" aria-label="Minimize" data-i18n-aria-label="window.minimize">
                    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.4"/></svg>
                </button>
                <button id="btn-max" class="win-btn" aria-label="Maximize" data-i18n-aria-label="window.maximize">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" stroke="currentColor" stroke-width="1.2"/></svg>
                </button>
                <button id="btn-close" class="win-btn close-btn" aria-label="Close" data-i18n-aria-label="window.close">
                    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.3"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5" stroke="currentColor" stroke-width="1.3"/></svg>
                </button>
            </div>
        </header>

        <div class="layout">
            <!-- Primary rail (first sidebar) -->
            <nav class="rail" data-i18n-aria-label="nav.workspace" aria-label="Workspace">
                <div class="rail-logo">
                    <img src="../public/Tactile.svg" alt="Tactile" class="app-brand-logo">
                </div>

                <div class="rail-group">
                    <button class="nav-item rail-item active" data-view="profiles" data-i18n-title="nav.sounds" title="" data-i18n-aria-label="nav.sounds" aria-label="">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                        <span data-i18n="nav.sounds"></span>
                    </button>
                    <button class="nav-item rail-item" data-view="custom" data-i18n-title="nav.import" title="" data-i18n-aria-label="nav.import" aria-label="">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <span data-i18n="nav.import"></span>
                    </button>
                    <button class="nav-item rail-item" data-view="docs" data-i18n-title="nav.documents" title="" data-i18n-aria-label="nav.documents" aria-label="">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        <span data-i18n="nav.documents"></span>
                    </button>
                </div>

                <div class="rail-spacer"></div>

                <div class="rail-group">
                    <button class="nav-item rail-item" data-view="diagnostics" data-i18n-title="nav.diagnostics" title="" data-i18n-aria-label="nav.diagnostics" aria-label="">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                        <span data-i18n="nav.diagnostics"></span>
                    </button>
                    <button class="nav-item rail-item" data-view="settings" data-i18n-title="nav.settings" title="" data-i18n-aria-label="nav.settings" aria-label="">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        <span data-i18n="nav.settings"></span>
                    </button>
                    <button class="nav-item rail-item" data-view="about" data-i18n-title="nav.about" title="" data-i18n-aria-label="nav.about" aria-label="">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                        <span data-i18n="nav.about"></span>
                    </button>
                </div>

                <div class="rail-footer">
                    <button id="btn-sponsor" class="rail-icon-btn" data-i18n-title="about.sponsor" title="" data-i18n-aria-label="about.sponsor" aria-label="">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
                    </button>
                    <span class="rail-version" id="rail-version"></span>
                </div>
            </nav>

            <!-- Contextual sidebar (second sidebar) -->
            <aside class="subnav" id="subnav">
                <section class="subnav-panel active" data-panel="profiles">
                    <div class="subnav-head">
                        <span class="subnav-eyebrow" data-i18n="nav.workspace"></span>
                        <h2 data-i18n="sidebar.library"></h2>
                        <p data-i18n="sidebar.library_desc"></p>
                    </div>
                    <div class="subnav-block">
                        <div class="subnav-block-head">
                            <span data-i18n="sidebar.categories"></span>
                            <span class="subnav-actions">
                                <button class="icon-action" id="btn-edit-categories" data-i18n-title="modal.manage_title" title="" data-i18n-aria-label="modal.manage_title" aria-label="">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"/></svg>
                                </button>
                                <button class="icon-action" id="btn-add-category" data-i18n-title="modal.create_category_title" title="" data-i18n-aria-label="modal.create_category_title" aria-label="">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                </button>
                            </span>
                        </div>
                        <div id="dynamic-categories-list" class="category-list"></div>
                    </div>
                    <div class="subnav-block">
                        <div class="subnav-block-head"><span data-i18n="sidebar.status"></span></div>
                        <dl class="stat-list">
                            <div><dt data-i18n="sidebar.profiles_count"></dt><dd id="stat-profiles">0</dd></div>
                            <div><dt data-i18n="sidebar.categories_count"></dt><dd id="stat-categories">0</dd></div>
                            <div><dt data-i18n="sidebar.cloud"></dt><dd id="stat-cloud" data-i18n="sidebar.cloud_off"></dd></div>
                            <div><dt data-i18n="sidebar.local_user"></dt><dd>Tactile</dd></div>
                        </dl>
                    </div>
                    <div class="subnav-block">
                        <div class="subnav-block-head"><span data-i18n="sidebar.quick_actions"></span></div>
                        <button class="subnav-action" id="btn-quick-import" data-i18n="nav.import"></button>
                        <button class="subnav-action" id="btn-quick-backup" data-i18n="cloud.sync_now"></button>
                    </div>
                </section>

                <section class="subnav-panel" data-panel="settings">
                    <div class="subnav-head">
                        <span class="subnav-eyebrow" data-i18n="nav.application"></span>
                        <h2 data-i18n="nav.settings"></h2>
                        <p data-i18n="settings.subtitle"></p>
                    </div>
                    <div class="section-nav">
                        <button class="section-link active" data-section="general" data-i18n="settings.section_general"></button>
                        <button class="section-link" data-section="appearance" data-i18n="settings.section_appearance"></button>
                        <button class="section-link" data-section="language" data-i18n="settings.section_language"></button>
                        <button class="section-link" data-section="sound" data-i18n="settings.section_sound"></button>
                        <button class="section-link" data-section="shortcuts" data-i18n="settings.section_shortcuts"></button>
                        <button class="section-link" data-section="data" data-i18n="settings.section_data"></button>
                        <button class="section-link" data-section="updates" data-i18n="settings.section_updates"></button>
                        <button class="section-link" data-section="ai" data-i18n="settings.section_ai"></button>
                        <button class="section-link" data-section="integrations" data-i18n="settings.section_integrations"></button>
                    </div>
                </section>

                <section class="subnav-panel" data-panel="docs">
                    <div class="subnav-head">
                        <span class="subnav-eyebrow" data-i18n="nav.support"></span>
                        <h2 data-i18n="docs.title"></h2>
                        <p data-i18n="docs.desc"></p>
                    </div>
                    <div class="section-nav">
                        <button class="section-link" data-docs="getting_started" data-i18n="docs.getting_started"></button>
                        <button class="section-link" data-docs="profiles" data-i18n="docs.profiles"></button>
                        <button class="section-link" data-docs="sync" data-i18n="docs.sync"></button>
                        <button class="section-link" data-docs="shortcuts" data-i18n="docs.shortcuts"></button>
                        <button class="section-link" data-docs="assistant" data-i18n="docs.assistant"></button>
                        <button class="section-link" data-docs="integrations" data-i18n="docs.integrations"></button>
                        <button class="section-link" data-docs="privacy" data-i18n="docs.privacy"></button>
                    </div>
                </section>

                <section class="subnav-panel" data-panel="diagnostics">
                    <div class="subnav-head">
                        <span class="subnav-eyebrow" data-i18n="nav.support"></span>
                        <h2 data-i18n="diag.title"></h2>
                        <p data-i18n="diag.desc"></p>
                    </div>
                    <dl class="stat-list">
                        <div><dt data-i18n="diag.db"></dt><dd id="subnav-diag-db" data-i18n="diag.ok"></dd></div>
                        <div><dt data-i18n="diag.hook"></dt><dd id="subnav-diag-hook" data-i18n="diag.ok"></dd></div>
                        <div><dt data-i18n="diag.tray"></dt><dd id="subnav-diag-tray" data-i18n="diag.ok"></dd></div>
                    </dl>
                </section>

                <section class="subnav-panel" data-panel="about">
                    <div class="subnav-head">
                        <span class="subnav-eyebrow" data-i18n="about.developer"></span>
                        <h2 data-i18n="nav.about"></h2>
                        <p data-i18n="about.registered"></p>
                    </div>
                    <button class="subnav-action" id="btn-subnav-github" data-i18n="about.github"></button>
                    <button class="subnav-action" id="btn-subnav-sponsor" data-i18n="about.sponsor"></button>
                    <button class="subnav-action" id="btn-subnav-docs" data-i18n="about.docs"></button>
                </section>
            </aside>

            <main class="content-area">
                <div class="toolbar" id="main-toolbar">
                    <div class="search-box">
                        <input type="text" id="search-input" data-i18n-placeholder="toolbar.search" placeholder="" aria-label="" data-i18n-aria-label="toolbar.search">
                        <button id="btn-clear-search" class="btn-clear-search" data-i18n-title="toolbar.clear_search" title="" data-i18n-aria-label="toolbar.clear_search" aria-label="">
                            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.3"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5" stroke="currentColor" stroke-width="1.3"/></svg>
                        </button>
                    </div>
                    <div class="global-controls">
                        <span class="active-profile-badge" id="active-profile-name" data-i18n="toolbar.no_profile"></span>
                        <div class="volume-control">
                            <button id="btn-toggle-mute" class="btn-mute" data-i18n-title="toolbar.mute_title" title="" aria-label="" data-i18n-aria-label="toolbar.mute_title">
                                <svg class="volume-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                            </button>
                            <input type="range" id="global-volume" min="0" max="100" value="50" aria-label="" data-i18n-aria-label="toolbar.volume">
                        </div>
                    </div>
                </div>

                <div class="views-container">
                    <!-- Sound library -->
                    <div id="view-profiles" class="view active">
                        <div class="view-header">
                            <div>
                                <h1 data-i18n="nav.sounds"></h1>
                                <p data-i18n="sidebar.library_desc"></p>
                            </div>
                            <div class="action-buttons">
                                <button class="btn primary" id="btn-create-profile-modal" data-i18n="btn.new_profile"></button>
                            </div>
                        </div>
                        <div class="profiles-header-actions">
                            <div class="filters" id="material-filters">
                                <button class="chip active" data-i18n="filter.all">All</button>
                                <button class="chip">PBT</button>
                                <button class="chip">ABS</button>
                            </div>
                        </div>
                        <div class="grid" id="profiles-grid"></div>
                    </div>

                    <!-- Import -->
                    <div id="view-custom" class="view">
                        <div class="view-header">
                            <div>
                                <h1 data-i18n="nav.import"></h1>
                                <p data-i18n="import.drag_desc"></p>
                            </div>
                        </div>
                        <div class="custom-layout">
                            <div class="custom-card-import">
                                <div class="drag-drop-zone" id="drop-zone">
                                    <div class="drop-icon">
                                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    </div>
                                    <h3 data-i18n="import.drag_title"></h3>
                                    <p data-i18n="import.drag_desc"></p>
                                    <button class="btn primary" id="btn-select-folder" data-i18n="import.select_folder"></button>
                                </div>
                            </div>
                        </div>
                        <div class="grid" id="custom-grid"></div>
                    </div>

                    <!-- Settings -->
                    <div id="view-settings" class="view">
                        <div class="view-header">
                            <div>
                                <h1 data-i18n="settings.title"></h1>
                                <p data-i18n="settings.subtitle"></p>
                            </div>
                            <span class="version-pill" id="settings-version"></span>
                        </div>

                        <div class="settings-scroll">
                            <section class="settings-section" id="settings-general" data-section="general">
                                <h2 data-i18n="settings.section_general"></h2>

                                <div class="setting-item">
                                    <div class="setting-info">
                                        <h3 id="setting-mute-label" data-i18n="settings.mute_title"></h3>
                                        <p data-i18n="settings.mute_desc"></p>
                                    </div>
                                    <label class="switch">
                                        <input type="checkbox" id="setting-mute" aria-labelledby="setting-mute-label">
                                        <span class="slider"></span>
                                    </label>
                                </div>

                                <div class="setting-item">
                                    <div class="setting-info">
                                        <h3 id="setting-startup-label" data-i18n="settings.startup_title"></h3>
                                        <p data-i18n="settings.startup_desc"></p>
                                    </div>
                                    <label class="switch">
                                        <input type="checkbox" id="setting-startup" aria-labelledby="setting-startup-label">
                                        <span class="slider"></span>
                                    </label>
                                </div>

                                <div class="setting-item">
                                    <div class="setting-info">
                                        <h3 id="setting-close-label" data-i18n="settings.close_title"></h3>
                                        <p data-i18n="settings.close_desc"></p>
                                    </div>
                                    <select id="setting-close-behavior" class="form-select" aria-labelledby="setting-close-label">
                                        <option value="ask" data-i18n="settings.close_ask"></option>
                                        <option value="tray" data-i18n="settings.close_tray"></option>
                                        <option value="quit" data-i18n="settings.close_quit"></option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <div class="setting-info">
                                        <h3 id="setting-tray-label" data-i18n="settings.tray_title"></h3>
                                        <p data-i18n="settings.tray_desc"></p>
                                    </div>
                                    <label class="switch">
                                        <input type="checkbox" id="setting-tray" aria-labelledby="setting-tray-label">
                                        <span class="slider"></span>
                                    </label>
                                </div>

                                <div class="setting-item">
                                    <div class="setting-info">
                                        <h3 id="setting-tray-single-label" data-i18n="settings.tray_click_single_title"></h3>
                                        <p data-i18n="settings.tray_click_single_desc"></p>
                                    </div>
                                    <select id="setting-tray-single" class="form-select" aria-labelledby="setting-tray-single-label">
                                        <option value="open" data-i18n="settings.tray_action_open"></option>
                                        <option value="mute" data-i18n="settings.tray_action_mute"></option>
                                        <option value="vol_up" data-i18n="settings.tray_action_vol_up"></option>
                                        <option value="vol_down" data-i18n="settings.tray_action_vol_down"></option>
                                        <option value="none" data-i18n="settings.tray_action_none"></option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <div class="setting-info">
                                        <h3 id="setting-tray-double-label" data-i18n="settings.tray_click_double_title"></h3>
                                        <p data-i18n="settings.tray_click_double_desc"></p>
                                    </div>
                                    <select id="setting-tray-double" class="form-select" aria-labelledby="setting-tray-double-label">
                                        <option value="open" data-i18n="settings.tray_action_open"></option>
                                        <option value="mute" data-i18n="settings.tray_action_mute"></option>
                                        <option value="vol_up" data-i18n="settings.tray_action_vol_up"></option>
                                        <option value="vol_down" data-i18n="settings.tray_action_vol_down"></option>
                                        <option value="none" data-i18n="settings.tray_action_none"></option>
                                    </select>
                                </div>
                            </section>

                            <section class="settings-section" id="settings-appearance" data-section="appearance">
                                <h2 data-i18n="settings.section_appearance"></h2>

                                <div class="setting-item">
                                    <div class="setting-info">
